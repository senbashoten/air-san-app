<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>エア算</title>
<style>
:root{--brand:#0f766e;--dark:#115e59;--bg:#f1f5f4;--card:#fff;--text:#17201f;--sub:#64706e;--line:#d7dfdd;--soft:#e8f5f2;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom))}header{background:linear-gradient(135deg,var(--dark),var(--brand));color:#fff;padding:18px 16px 20px}header>div,main,.total-inner{max-width:820px;margin:auto}h1{margin:0;font-size:28px}.tagline{opacity:.85;font-size:13px}main{padding:14px}.card{background:var(--card);border:1px solid #e4e9e8;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px #233a3510}label{display:block;color:var(--sub);font-size:12px;margin:0 0 5px}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px}button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-weight:700}button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.buttons button,.file-label{flex:1;min-width:120px}.file-label{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}.file-label input{display:none}.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}.category{margin:10px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.category summary{cursor:pointer;padding:13px 14px;font-weight:800;background:#f8faf9;display:flex;justify-content:space-between}.count,.pill{font-size:11px;color:var(--dark);background:var(--soft);border-radius:99px;padding:3px 8px}.item{display:grid;grid-template-columns:1fr 82px 30px;gap:9px;padding:12px;border-top:1px solid #edf0ef}.item input[type=checkbox]{width:23px;height:23px;accent-color:var(--brand);justify-self:end}.item-name{font-weight:700;font-size:14px}.meta,.notice{font-size:12px;color:var(--sub);line-height:1.5}.price{text-align:right;font-weight:800;white-space:nowrap}.controls{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:8px}.subtotal{grid-column:1/4;text-align:right;color:var(--brand);font-weight:800;font-size:13px}.empty{text-align:center;padding:35px 15px}.empty h2{margin:0 0 8px}.totalbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}.total-inner{display:flex;justify-content:space-between;align-items:center;gap:8px}.total-actions{display:flex;gap:7px}.total-actions button{padding:10px 11px}.total-label{font-size:11px;color:var(--sub)}#total{font-size:27px;font-weight:900;color:var(--dark)}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}.hidden{display:none!important}.sheet{background:#fff;width:min(100%,820px);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheet textarea{height:180px}@media(max-width:560px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 75px 28px}.total-actions button{font-size:13px;padding:10px 8px}}
</style></head><body><header><div><h1>エア算</h1><div class="tagline">工事費を、すばやく・まちがいなく。</div></div></header><main>
<section class="card"><div class="grid"><div><label>荷主</label><select id="clientSelect"></select></div><div><label>現場名・お客さま名（任意）</label><input id="site" placeholder="例：山田さま"></div></div><div class="buttons"><button id="addClient">荷主を追加</button><button id="renameClient">名称変更</button><button id="settings">項目・単価設定</button></div></section>
<div class="search"><input id="search" type="search" placeholder="工事項目を検索"></div><div id="catalog"></div>
<section class="card"><div class="buttons"><label class="file-label">料金表を読み込む<input id="importFile" type="file" accept="application/json,.json"></label><button id="exportFile">料金表を保存</button><button id="reset">選択解除</button><button id="copy">明細コピー</button></div><p class="notice">料金表はこの端末内だけに保存されます。公開ページやサーバーへ送信しません。端末故障やSafariデータ削除に備えて「料金表を保存」でバックアップしてください。</p></section></main>
<div class="totalbar"><div class="total-inner"><div><div class="total-label">税込合計</div><div id="total">0円</div></div><div class="total-actions"><button id="resetBottom">選択解除</button><button class="primary" id="copyBottom">明細コピー</button></div></div></div>
<div id="modal" class="modal hidden"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="buttons"><button id="modalClose">閉じる</button></div></div></div>
<script>
const KEY='air_san_private_v2';let state={version:2,selectedClientId:'',site:'',clients:[]};
const $=s=>document.querySelector(s),yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0))+'円',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>state.clients.find(x=>x.id===state.selectedClientId)||state.clients[0];
function normalize(x){if(!x?.clients?.length)throw Error();x.version=2;x.clients.forEach(c=>c.items=(c.items||[]).map((i,n)=>({id:i.id||`i${n}`,category:i.category||'その他',name:i.name||'名称未設定',price:i.price===null?null:Number(i.price||0),note:i.note||'',selected:false,qty:1,customPrice:Number(i.customPrice||0)})));x.selectedClientId=x.clients.some(c=>c.id===x.selectedClientId)?x.selectedClientId:x.clients[0].id;return x}
function save(){state.site=$('#site').value;localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x?.clients?.length)state=normalize(x)}catch{}$('#site').value=state.site||'';renderClients();render()}
function renderClients(){const s=$('#clientSelect');s.innerHTML=state.clients.length?state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''):'<option>料金表未登録</option>';s.disabled=!state.clients.length;s.value=state.selectedClientId}
function render(){if(!state.clients.length){$('#catalog').innerHTML='<section class="card empty"><h2>料金表を読み込んでください</h2><p class="notice">「料金表を読み込む」から、エア算専用のJSONファイルを選択します。</p></section>';calc();return}const q=$('#search').value.trim().toLowerCase(),groups={};current().items.forEach(i=>{if(!q||`${i.category} ${i.name} ${i.note}`.toLowerCase().includes(q))(groups[i.category]??=[]).push(i)});$('#catalog').innerHTML=Object.entries(groups).map(([cat,list])=>`<details class="category" ${cat==='エアコン標準工事'&&list.some(x=>x.selected)?'':'open'}><summary>${esc(cat)}<span class="count">${list.filter(x=>x.selected).length}/${list.length}</span></summary>${list.map(itemHtml).join('')}</details>`).join('');bind();calc()}
function itemHtml(x){const p=x.price===null?'見積':yen(x.price),v=x.price===null?x.customPrice:x.price;return `<div class="item"><div><div class="item-name">${esc(x.name)}</div>${x.note?`<div class="meta">${esc(x.note)}</div>`:''}</div><div class="price">${p}</div><input type="checkbox" data-check="${x.id}" ${x.selected?'checked':''}>${x.selected?`<div class="controls">${x.price===null?`<div><label>税込金額</label><input type="number" data-price="${x.id}" value="${x.customPrice||''}"></div>`:'<div></div>'}<div><label>数量・長さ</label><input type="number" inputmode="decimal" min="0" step="0.1" data-qty="${x.id}" value="${x.qty}"></div></div><div class="subtotal">小計 ${yen(v*x.qty)}</div>`:''}</div>`}
function bind(){$$('[data-check]').forEach(e=>e.onchange=()=>{current().items.find(i=>i.id===e.dataset.check).selected=e.checked;save();render()});$$('[data-qty]').forEach(e=>e.onchange=()=>{current().items.find(i=>i.id===e.dataset.qty).qty=Number(e.value)||0;save();render()});$$('[data-price]').forEach(e=>e.onchange=()=>{current().items.find(i=>i.id===e.dataset.price).customPrice=Number(e.value)||0;save();render()})}function $$(s){return document.querySelectorAll(s)}
function calc(){const t=state.clients.length?current().items.filter(x=>x.selected).reduce((s,x)=>s+(x.price===null?x.customPrice:x.price)*x.qty,0):0;$('#total').textContent=yen(t)}
function detail(){save();const c=current(),lines=['【エア算 工事費明細】',`荷主：${c.name}`];if(state.site)lines.push(`現場：${state.site}`);lines.push('');let t=0;c.items.filter(x=>x.selected).forEach(x=>{const p=x.price===null?x.customPrice:x.price,v=p*x.qty;t+=v;lines.push(`${x.name}　${yen(p)} × ${x.qty} ＝ ${yen(v)}`)});lines.push('',`税込合計：${yen(t)}`);return lines.join('\n')}
async function copy(){if(!state.clients.length)return alert('料金表を読み込んでください');try{await navigator.clipboard.writeText(detail());alert('明細をコピーしました')}catch{show('明細',`<textarea>${esc(detail())}</textarea>`)}}
function show(t,h){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}
$('#importFile').onchange=async e=>{try{const text=await e.target.files[0].text(),incoming=JSON.parse(text);if(incoming.importMode==='merge'&&incoming?.clients?.length){const added=normalize(incoming).clients;added.forEach(c=>{const n=state.clients.findIndex(x=>x.id===c.id||x.name===c.name);if(n>=0)state.clients[n]=c;else state.clients.push(c)});state.selectedClientId=added[0].id}else state=normalize(incoming);save();renderClients();render();alert('料金表を端末に保存しました')}catch{alert('エア算の料金表ファイルを確認してください')}e.target.value=''};
$('#exportFile').onclick=()=>{if(!state.clients.length)return alert('保存する料金表がありません');save();const clean=structuredClone(state);clean.clients.forEach(c=>c.items.forEach(i=>{i.selected=false;i.qty=1}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(clean,null,2)],{type:'application/json'}));a.download='エア算_料金表バックアップ.json';a.click();URL.revokeObjectURL(a.href)};
function resetSelection(){if(!state.clients.length)return;current().items.forEach(x=>{x.selected=false;x.qty=1});save();render()}$('#clientSelect').onchange=e=>{state.selectedClientId=e.value;save();render()};$('#site').oninput=save;$('#search').oninput=render;$('#reset').onclick=resetSelection;$('#resetBottom').onclick=resetSelection;$('#copy').onclick=copy;$('#copyBottom').onclick=copy;
$('#addClient').onclick=()=>{if(!state.clients.length)return alert('最初に料金表を読み込んでください');const n=prompt('荷主名');if(!n?.trim())return;const id='c'+Date.now();state.clients.push({id,name:n.trim(),items:structuredClone(current().items).map(x=>({...x,selected:false,qty:1}))});state.selectedClientId=id;save();renderClients();render()};$('#renameClient').onclick=()=>{if(!state.clients.length)return;const n=prompt('荷主名を変更',current().name);if(n?.trim()){current().name=n.trim();save();renderClients()}};
$('#settings').onclick=()=>{if(!state.clients.length)return alert('料金表を読み込んでください');show('項目・単価設定',`<p class="notice">項目の追加・詳細編集は次版で対応します。現在は料金表ファイルを編集して再読込できます。</p>`)};$('#modalClose').onclick=()=>$('#modal').classList.add('hidden');
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));load();
</script></body></html>
