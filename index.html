<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1976bd">
<title>エア算 β版</title>

<style>
:root{
  --bg:#f6fafc;
  --card:#fff;
  --text:#17354a;
  --muted:#6b7c89;
  --line:#dce8ee;
  --blue:#2176bd;
  --teal:#31b6b7;
  --danger:#ba3232;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  padding-bottom:100px;
}
header{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:15px;
}
.head{
  max-width:820px;
  margin:auto;
}
h1{
  font-size:27px;
  margin:0;
}
.beta{
  font-size:11px;
  background:#e8f8f8;
  color:#237b7d;
  padding:4px 8px;
  border-radius:99px;
  font-weight:800;
  margin-left:6px;
}
main{
  max-width:820px;
  margin:auto;
  padding:12px;
}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-bottom:12px;
}
.notice{
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
}
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
button{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:10px 12px;
  font-weight:800;
  background:#eaf1f7;
  color:#245278;
}
button.primary{
  background:linear-gradient(90deg,var(--blue),var(--teal));
  color:#fff;
}
button.danger{
  background:#fdecec;
  color:#9b2222;
}
input{
  font:inherit;
}
.search{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:16px;
}
.category{
  margin:10px 0;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  overflow:hidden;
}
.category summary{
  padding:12px 13px;
  font-weight:900;
  background:#f9fbfc;
  cursor:pointer;
}
.item{
  display:grid;
  grid-template-columns:30px 1fr 90px;
  gap:8px;
  align-items:center;
  padding:11px 12px;
  border-top:1px solid #edf2f5;
}
.item input[type=checkbox]{
  width:22px;
  height:22px;
}
.name{
  font-weight:800;
  font-size:14px;
}
.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}
.qty{
  width:100%;
  padding:8px;
  border:1px solid var(--line);
  border-radius:9px;
}
.subtotal{
  grid-column:2/4;
  text-align:right;
  font-weight:900;
  color:#237b7d;
}
details.settings summary{
  font-weight:900;
  cursor:pointer;
}
.editrow{
  display:grid;
  grid-template-columns:.8fr 1.3fr .5fr .7fr 36px;
  gap:5px;
  align-items:center;
  margin:7px 0;
}
.editrow input{
  width:100%;
  padding:8px 5px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:13px;
}
.totalbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.totalinner{
  max-width:820px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.total{
  font-size:30px;
  font-weight:950;
}

/* お客さん確認画面 */
.customerModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:none;
  padding:18px;
  overflow:auto;
}
.customerModal.show{
  display:block;
}
.customerSheet{
  max-width:760px;
  margin:20px auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  min-height:calc(100vh - 76px);
}
.customerTitle{
  font-size:25px;
  font-weight:950;
  margin:0 0 4px;
}
.customerSub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
}
.customerRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  align-items:center;
}
.customerName{
  font-weight:850;
  line-height:1.35;
}
.customerQty{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.customerAmount{
  font-weight:900;
  white-space:nowrap;
}
.customerTotal{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#eefafa;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.customerTotal strong{
  font-size:28px;
}
.customerActions{
  display:flex;
  gap:8px;
  margin-top:18px;
}
.customerActions button{
  flex:1;
}
</style>
</head>

<body>

<header>
  <div class="head">
    <div>
      <h1>エア算 <span class="beta">β版</span></h1>
      <div class="notice">エアコン追加工事の料金を、現場ですぐ計算</div>
    </div>
  </div>
</header>

<main>

<div class="card">
  <strong>参考金額入りテンプレート</strong>

  <p class="notice">
    最初から参考金額が入っています。
    実際に使う前に、ご自身の料金表に合わせて変更してください。
    変更内容はこの端末内に保存されます。
  </p>

  <div class="toolbar">
    <button class="primary" id="openSettings">料金・項目を編集</button>
    <button id="reset">選択解除</button>
    <button id="copy">明細コピー</button>
    <button id="showList">一覧表示</button>
  </div>
</div>

<div class="card">
  <input id="search" class="search" placeholder="工事項目を検索">
</div>

<div id="catalog"></div>

<details class="card settings" id="settingsBox">

  <summary>料金・項目を編集</summary>

  <p class="notice">
    分類・工事項目・単位・金額を自由に変更できます。
    項目の追加・削除もできます。
  </p>

  <div id="edit"></div>

  <div class="toolbar" style="margin-top:10px">
    <button id="add">＋ 項目追加</button>
    <button class="primary" id="save">変更を保存</button>
    <button class="danger" id="restore">初期テンプレートに戻す</button>
  </div>

</details>

</main>

<div id="customerModal" class="customerModal">

  <div class="customerSheet">

    <div class="customerTitle">
      工事内容のご確認
    </div>

    <div class="customerSub">
      選択した工事内容と合計金額をご確認ください。
    </div>

    <div id="customerList"></div>

    <div class="customerTotal">
      <span>税込合計</span>
      <strong id="customerTotal">0円</strong>
    </div>

    <div class="customerActions">
      <button id="closeList">戻る</button>
    </div>

  </div>

</div>

<div class="totalbar">

  <div class="totalinner">

    <div>
      <div class="notice">税込合計</div>
      <div class="total" id="total">0円</div>
    </div>

    <button class="primary" id="reset2">
      クリア
    </button>

  </div>

</div>

<script>

const KEY="airsan_beta_v2";

const DEFAULT_ITEMS=[

{category:"標準・撤去",name:"壁掛ルームエアコン設置（4kW未満）",price:20000,unit:"台"},
{category:"標準・撤去",name:"壁掛ルームエアコン設置（4kW以上）",price:24800,unit:"台"},
{category:"標準・撤去",name:"隠ぺい配管エアコン交換工事",price:36000,unit:"台"},
{category:"標準・撤去",name:"既存エアコン撤去（標準）",price:8500,unit:"台"},

{category:"架台・高所",name:"立ちおろし設置追加工事",price:18000,unit:"台"},
{category:"架台・高所",name:"既存エアコン撤去（壁架け）",price:11000,unit:"台"},
{category:"架台・高所",name:"屋根置き・壁掛け・公団吊 新規工事",price:17000,unit:"台"},
{category:"架台・高所",name:"屋根置き・壁掛け・公団吊 交換工事",price:9000,unit:"台"},
{category:"架台・高所",name:"2段置き設置 新規工事",price:22000,unit:"式"},
{category:"架台・高所",name:"2段置き設置 交換工事",price:8500,unit:"式"},

{category:"配管・ドレン",name:"配管延長 2分3分",price:4000,unit:"m"},
{category:"配管・ドレン",name:"配管延長 2分4分",price:5000,unit:"m"},
{category:"配管・ドレン",name:"ドレンホース延長",price:1000,unit:"m"},

{category:"取付補助",name:"たて桟工事",price:3000,unit:"式"},

{category:"運搬",name:"上層階への運搬（3F）",price:3500,unit:"台"},
{category:"運搬",name:"上層階への運搬（4F）",price:4000,unit:"台"},
{category:"運搬",name:"上層階への運搬（5F）",price:4500,unit:"台"},

{category:"穴あけ・石綿",name:"穴あけ（木造・ALC・モルタル）",price:9000,unit:"箇所"},
{category:"穴あけ・石綿",name:"処分費（くり抜いた壁材）",price:3000,unit:"箇所"},
{category:"穴あけ・石綿",name:"石綿対応工事",price:15000,unit:"箇所"},

{category:"電気工事",name:"専用回路増設（100V・200V）",price:19000,unit:"回路"},
{category:"電気工事",name:"配線延長（100V・200V）",price:3000,unit:"m"},
{category:"電気工事",name:"アース線付回路増設",price:10000,unit:"回路"},
{category:"電気工事",name:"アース線延長",price:800,unit:"m"},
{category:"電気工事",name:"コンセント交換（100V）",price:5000,unit:"個"},
{category:"電気工事",name:"コンセント交換（200V）",price:6000,unit:"個"},
{category:"電気工事",name:"電圧切替・端子台識替え",price:4000,unit:"式"},
{category:"電気工事",name:"補助ブレーカー増設",price:10000,unit:"個"},

{category:"化粧カバー",name:"配管化粧カバー（標準）",price:8000,unit:"式"},
{category:"化粧カバー",name:"配管化粧カバー延長（ストレート）",price:5000,unit:"m"},
{category:"化粧カバー",name:"配管化粧カバー延長（曲がり）",price:3000,unit:"箇所"},
{category:"化粧カバー",name:"配管化粧カバー（既存利用）",price:5000,unit:"式"},

{category:"室内カバー",name:"室内配管化粧カバー（標準・2mまで）",price:14000,unit:"式"},
{category:"室内カバー",name:"室内配管化粧カバー（ストレート）",price:5000,unit:"m"},
{category:"室内カバー",name:"室内配管化粧カバー（曲がり）",price:4000,unit:"箇所"},
{category:"室内カバー",name:"室内配管化粧カバー（既存利用）",price:10000,unit:"式"},

{category:"その他",name:"窓用エアコン設置",price:10000,unit:"台"},
{category:"その他",name:"窓用エアコン撤去・交換",price:5000,unit:"台"}

];

function makeDefault(){

  return DEFAULT_ITEMS.map(x=>({
    ...x,
    qty:0,
    selected:false
  }));

}

let items=load();

function load(){

  try{

    const data=JSON.parse(
      localStorage.getItem(KEY)
    );

    if(
      Array.isArray(data) &&
      data.length
    ){

      return data;

    }

  }catch(e){}

  return makeDefault();

}

function saveLocal(){

  localStorage.setItem(
    KEY,
    JSON.stringify(items)
  );

}

function yen(n){

  return new Intl.NumberFormat(
    "ja-JP"
  ).format(
    Math.round(Number(n)||0)
  )+"円";

}

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}

function render(){

  const search=
    document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const groups={};

  items.forEach((x,i)=>{

    const text=
      (x.category+" "+x.name)
      .toLowerCase();

    if(
      search &&
      !text.includes(search)
    ){
      return;
    }

    if(!groups[x.category]){
      groups[x.category]=[];
    }

    groups[x.category].push([x,i]);

  });

  document
  .getElementById("catalog")
  .innerHTML=

  Object.entries(groups)
  .map(([category,list])=>`

    <details class="category" open>

      <summary>
        ${esc(category)}
      </summary>

      ${list.map(([x,i])=>`

      <div class="item">

        <input
          type="checkbox"
          data-check="${i}"
          ${x.selected?"checked":""}
        >

        <div>

          <div class="name">
            ${esc(x.name)}
          </div>

          <div class="meta">
            ${yen(x.price)}
            /
            ${esc(x.unit)}
          </div>

        </div>

        <input
          class="qty"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.1"
          value="${x.qty||0}"
          data-qty="${i}"
        >

        <div class="subtotal">

          小計

          ${
            yen(
              x.selected
              ? (x.qty||0)*x.price
              : 0
            )
          }

        </div>

      </div>

      `).join("")}

    </details>

  `).join("");

  document
  .querySelectorAll("[data-check]")
  .forEach(el=>{

    el.onchange=()=>{

      const item=
        items[
          Number(el.dataset.check)
        ];

      item.selected=
        el.checked;

      if(
        item.selected &&
        !item.qty
      ){

        item.qty=1;

      }

      saveLocal();

      render();

    };

  });

  document
  .querySelectorAll("[data-qty]")
  .forEach(el=>{

    el.onchange=()=>{

      const item=
        items[
          Number(el.dataset.qty)
        ];

      item.qty=
        Math.max(
          0,
          Number(el.value)||0
        );

      if(item.qty>0){

        item.selected=true;

      }

      saveLocal();

      render();

    };

  });

  renderEdit();

  calc();

}

function calc(){

  const total=
    items.reduce(
      (sum,x)=>{

        if(!x.selected){

          return sum;

        }

        return sum+
          (Number(x.qty)||0)*
          (Number(x.price)||0);

      },
      0
    );

  document
  .getElementById("total")
  .textContent=
    yen(total);

}

function renderEdit(){

  document
  .getElementById("edit")
  .innerHTML=

  items.map((x,i)=>`

  <div class="editrow">

    <input
      data-cat="${i}"
      value="${esc(x.category)}"
      placeholder="分類"
    >

    <input
      data-name="${i}"
      value="${esc(x.name)}"
      placeholder="項目"
    >

    <input
      data-unit="${i}"
      value="${esc(x.unit)}"
      placeholder="単位"
    >

    <input
      data-price="${i}"
      type="number"
      inputmode="numeric"
      min="0"
      value="${x.price}"
    >

    <button
      class="danger"
      data-delete="${i}"
    >
      ×
    </button>

  </div>

  `).join("");

  document
  .querySelectorAll("[data-delete]")
  .forEach(btn=>{

    btn.onclick=()=>{

      const index=
        Number(
          btn.dataset.delete
        );

      if(
        confirm(
          "この項目を削除しますか？"
        )
      ){

        items.splice(
          index,
          1
        );

        saveLocal();

        render();

      }

    };

  });

}

function saveEdits(){

  document
  .querySelectorAll("[data-cat]")
  .forEach(el=>{

    items[
      Number(el.dataset.cat)
    ].category=
      el.value.trim()||
      "その他";

  });

  document
  .querySelectorAll("[data-name]")
  .forEach(el=>{

    items[
      Number(el.dataset.name)
    ].name=
      el.value.trim()||
      "名称未設定";

  });

  document
  .querySelectorAll("[data-unit]")
  .forEach(el=>{

    items[
      Number(el.dataset.unit)
    ].unit=
      el.value.trim()||
      "個";

  });

  document
  .querySelectorAll("[data-price]")
  .forEach(el=>{

    items[
      Number(el.dataset.price)
    ].price=
      Math.max(
        0,
        Number(el.value)||0
      );

  });

  saveLocal();

  render();

  alert(
    "料金表を保存しました"
  );

}

function resetSelection(){

  items.forEach(x=>{

    x.selected=false;

    x.qty=0;

  });

  saveLocal();

  render();

}

function showCustomerList(){

  const used=
    items.filter(
      x=>
        x.selected &&
        Number(x.qty)>0
    );

  if(!used.length){

    alert(
      "工事項目が選択されていません"
    );

    return;

  }

  const total=
    used.reduce(
      (sum,x)=>
        sum+
        (Number(x.qty)||0)*
        (Number(x.price)||0),
      0
    );

  document
  .getElementById("customerList")
  .innerHTML=

    used.map(x=>`

      <div class="customerRow">

        <div>

          <div class="customerName">
            ${esc(x.name)}
          </div>

          <div class="customerQty">

            ${x.qty}
            ${esc(x.unit)}

            ×

            ${yen(x.price)}

          </div>

        </div>

        <div class="customerAmount">

          ${
            yen(
              (Number(x.qty)||0)*
              (Number(x.price)||0)
            )
          }

        </div>

      </div>

    `).join("");

  document
  .getElementById(
    "customerTotal"
  )
  .textContent=
    yen(total);

  document
  .getElementById(
    "customerModal"
  )
  .classList
  .add("show");

  document.body.style.overflow=
    "hidden";

}

function closeCustomerList(){

  document
  .getElementById(
    "customerModal"
  )
  .classList
  .remove("show");

  document.body.style.overflow=
    "";

}

document
.getElementById("openSettings")
.onclick=()=>{

  const box=
    document
    .getElementById(
      "settingsBox"
    );

  box.open=true;

  box.scrollIntoView({
    behavior:"smooth"
  });

};

document
.getElementById("save")
.onclick=
  saveEdits;

document
.getElementById("add")
.onclick=()=>{

  items.push({

    category:"その他",

    name:"新しい項目",

    price:0,

    unit:"個",

    qty:0,

    selected:false

  });

  saveLocal();

  render();

  document
  .getElementById(
    "settingsBox"
  )
  .open=true;

};

document
.getElementById("restore")
.onclick=()=>{

  if(
    confirm(
      "編集した料金表を消して、初期テンプレートに戻しますか？"
    )
  ){

    items=
      makeDefault();

    saveLocal();

    render();

  }

};

document
.getElementById("reset")
.onclick=
  resetSelection;

document
.getElementById("reset2")
.onclick=
  resetSelection;

document
.getElementById("search")
.oninput=
  render;

document
.getElementById("showList")
.onclick=
  showCustomerList;

document
.getElementById("closeList")
.onclick=
  closeCustomerList;

document
.getElementById("copy")
.onclick=
async()=>{

  const used=
    items.filter(
      x=>
        x.selected &&
        x.qty>0
    );

  const total=
    used.reduce(
      (sum,x)=>
        sum+
        x.qty*x.price,
      0
    );

  const lines=
    used.map(x=>

      `${x.name}：${x.qty}${x.unit} × ${yen(x.price)} ＝ ${yen(x.qty*x.price)}`

    );

  lines.push("");

  lines.push(
    `合計：${yen(total)}`
  );

  const text=
    lines.join("\n");

  try{

    await navigator
      .clipboard
      .writeText(text);

    alert(
      "明細をコピーしました"
    );

  }catch(e){

    prompt(
      "下の明細をコピーしてください",
      text
    );

  }

};

render();

</script>

</body>
</html>
